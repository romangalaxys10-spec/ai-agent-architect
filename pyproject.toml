[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-architect"
version = "1.0.0"
description = "AI Agent Architect - Create your powerful Agents from scratch to maximum."
authors = [{ name = "AI Agent Architect", email = "architect@agent.ai" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.scripts]
agent-architect = "cli.architect:main"
agy-architect = "cli.architect:main"
