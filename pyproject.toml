[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-architect"
version = "2.0.0"
description = "AI Agent Architect v2.1 — complete end-to-end production agent framework: LLM providers, agent loop, tools, memory, agentic RAG, MCP+A2A, guardrails, HITL, budgets, evals, observability, and 215 sub-agents. Runs offline with zero API keys."
authors = [{ name = "AI Agent Architect", email = "architect@agent.ai" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.scripts]
agent-architect = "cli.architect:main"
agy-architect = "cli.architect:main"
